# One-click TEST deployment on Render (https://render.com) – SYNTHETIC DATA ONLY.
# Creates a PostgreSQL database and the web app; sample data is loaded on first start.
# Open: https://render.com/deploy?repo=https://github.com/SarahBahash/WeeklyMeeting
# Not for real Internal Audit data – production must use the company-approved
# environment and SSO (see docs/DEPLOYMENT.md).
databases:
  - name: weeklymeeting-db
    plan: free
    region: frankfurt
    databaseName: iahub
    user: iahub

services:
  - type: web
    name: weeklymeeting
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:demo
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: weeklymeeting-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      # You will be asked to choose the password for the synthetic test accounts.
      - key: SEED_DEV_PASSWORD
        sync: false
